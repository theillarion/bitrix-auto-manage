name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Clone SDK next to the checkout
        run: git clone https://github.com/theillarion/sdk-bitrix-time-manager ../sdk-bitrix-time-manager
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK and package with dev tools
        run: python -m pip install -e '../sdk-bitrix-time-manager' -e '.[dev]'
      - name: Lint and type checks
        run: |
          python -m ruff check src tests
          python -m mypy src
      - name: Test with coverage
        run: python -m pytest -q --cov=bitrix_auto_manage --cov-report=term-missing
