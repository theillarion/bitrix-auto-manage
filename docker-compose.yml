services:
  bitrix-auto:
    build:
      context: .
      args:
        BITRIX_SDK_REF: ${BITRIX_SDK_REF:-v0.2.0}
    container_name: bitrix-auto-manage
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      BITRIX_STATE_PATH: /app/state/operations.sqlite3
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./config:/app/config:ro
      - ./state:/app/state
