services:
  bitrix-auto:
    build: .
    container_name: bitrix-auto-manage
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      BITRIX_STATE_PATH: /app/state/operations.sqlite3
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./config:/app/config:ro
      - ./state:/app/state
      - ${BITRIX_SDK_PATH:-../sdk-python-bitrix-time-manager}:/opt/sdk:ro
