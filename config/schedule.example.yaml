# Расписание автоматического управления Time-менеджером.
# Можно создать несколько YAML-файлов в каталоге config/ — они объединяются,
# поздние файлы переопределяют скалярные значения и дополняют tasks.
#
# Рабочий день НЕ создается здесь: он появляется сам — по отметке СКУД
# или в момент начала удалённого дня (роботы портала).

timezone: Europe/Moscow

schedule:
  # Окно ежедневного прогона демона: "HH:MM-HH:MM" — случайный момент внутри
  # окна (строго в пределах одного дня, начало раньше конца); можно и точное
  # время "HH:MM" — тогда без рандома. Значение пишите в кавычках.
  apply_time: "16:00-19:00"
  # Сколько дней вперёд выставлять (включая сегодня).
  horizon_days: 2
  # Сколько прошедших дней догонять после простоя (создаст только отсутствующее).
  backfill_days: 4
  # Через сколько минут повторить прогон после ошибки.
  retry_minutes: 60
  # Даты, полностью исключаемые из планирования (формат YYYY-MM-DD):
  # за эти дни не создаётся НИЧЕГО — ни удалёнка, ни записи учета,
  # во всех командах (включая preview/apply --date). Пример:
  # skip_dates: ["2026-11-03", "2026-11-10"]
  # При нескольких YAML-файлах список позднего файла заменяет ранний.
  # Демон перечитывает конфиг перед каждым прогоном — правки
  # подхватываются без рестарта.
  skip_dates: []

tasks:
  # Удалённая работа: выставляется заранее, день привяжут роботы.
  - kind: remote
    # mon tue wed thu fri sat sun / пн вт ср чт пт сб вс; регистр не важен;
    # можно диапазон mon-fri — включительно, даже через границу недели (fri-mon).
    days: [wed]
    start: "08:00"
    end: "17:00"
    comment: "Удалённая работа"

  # Учет времени: записывается, как только за дату появился рабочий день
  # (СКУД или удалёнка); до этого прогон просто пропускает день и повторит позже.
  # Записи за день суммируются! Если за дату уже есть любая запись учета
  # (вручную, старым ботом), новая НЕ добавляется (on_existing_entries: skip).
  - kind: time_entry
    # mon tue wed thu fri sat sun / пн вт ср чт пт сб вс; регистр не важен;
    # можно диапазон mon-fri — включительно, даже через границу недели (fri-mon).
    days: [mon-fri]
    contract:
      entity_type: 1298
      id: 2             # Это "Общие задачи подразделения", если у вас другой договор, замените на свой (см docs/setup.md) 
    description: "ВПИШИТЕ ОПИСАНИЕ РАБОТ"
    hours: 8
    minutes: 0
    on_existing_entries: skip
